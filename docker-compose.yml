services:
  backend:
    build: ./backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      ALLOWED_ORIGINS: http://localhost:8080
    volumes:
      - buddy-data:/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  buddy-data:
