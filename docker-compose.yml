services:
  backend:
    build: ./backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      ALLOWED_ORIGINS: http://localhost:8080
      # Ollama runs on your computer, not in the container
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - buddy-data:/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  buddy-data:
