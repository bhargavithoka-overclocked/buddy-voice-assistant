[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buddy-backend"
version = "0.1.0"
description = "Backend for Buddy, a real-time voice assistant"
authors = [{ name = "Bhargavi Thoka" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
